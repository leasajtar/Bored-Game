<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<!-- HEADER -->
<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <!-- LEFT SIDE -->
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="bored game logo" height="50">
                </div>

                <!-- DESKTOP MENU -->
                <div class="nav-links">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                </div>

                <!-- HAMBURGER -->
                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- MOBILE MENU -->
                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}"><button class="left_btns">Pronađi</button></a>
                    <a th:href="@{/organiziranje}"><button class="left_btns">Organiziraj</button></a>
                </div>
            </div>


            <!-- SPACER -->
            <div class="flex-grow-1"></div>

            <!-- RIGHT SIDE -->
            <div class="nav-right">
                <div th:if="${loggedIn}">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>
                    <a th:href="@{/logout}">
                        <button class="login_btn">Log Out</button>
                    </a>
                </div>

                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}">
                        <button class="login_btn">Log In</button>
                    </a>
                </div>

                <a th:href="@{/aboutus}">
                    <button class="info_btn"><i class="fa-regular fa-circle-question"></i></button>
                </a>
            </div>

        </div>
    </div>
</section>

<section class="login">
    <h2>Registriraj se:</h2>

    <!-- Poruka o grešci ako username već postoji -->
    <p th:if="${param.error == 'exists'}" style="color: red;">Korisničko ime već postoji.</p>
    <!-- Poruka o uspjehu -->
    <p th:if="${param.success}" style="color: green;">Registracija uspješna! Možeš se prijaviti.</p>

    <div class="login_form">
        <form action="/register" method="post">
            <input name="username"  placeholder="Korisničko ime"        required><br>
            <input name="password"  placeholder="Lozinka"        type="password" required><br>
            <input name="email"     placeholder="Email"           type="email" required><br>
            <input name="ime"       placeholder="Ime"             required><br>
            <input name="prezime"   placeholder="Prezime"         required><br>

            <section class="gender_btns">
                <label><input type="radio" name="gender" value="0"> Žensko</label><br>
                <label><input type="radio" name="gender" value="1"> Muško</label><br>
                <label><input type="radio" name="gender" value="2"> Ostalo</label><br>
            </section>

            <input name="phone" placeholder="Br. mobitela (optional)"><br>

            <button class="login_submit_btn" type="submit">Registriraj se</button>
        </form>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
