<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pronađi</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="bored game logo" height="50">
                </div>
                <div class="nav-links">
                    <a th:href="@{/find}"><button class="left_btns">Pronađi</button></a>
                    <a th:href="@{/organiziranje}"><button class="left_btns">Organiziraj</button></a>
                </div>
                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}"><button class="left_btns">Pronađi</button></a>
                    <a th:href="@{/organiziranje}"><button class="left_btns">Organiziraj</button></a>
                </div>
            </div>

            <div class="flex-grow-1"></div>

            <div class="nav-right">
                <div th:if="${loggedIn}">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>
                    <a th:href="@{/profile}"><button class="profile_btn" title="Moj profil"><i class="fa-solid fa-circle-user"></i></button></a>
                    <a th:href="@{/logout}"><button class="login_btn">Log Out</button></a>
                </div>
                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}"><button class="login_btn">Log In</button></a>
                </div>
                <a th:href="@{/aboutus}">
                    <button class="info_btn"><i class="fa-regular fa-circle-question"></i></button>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- MAIN CONTENT -->
<div class="find-wrapper">

    <!-- SIDEBAR -->
    <aside class="find-sidebar">
        <h3 class="sidebar-title">Pronađi druženje</h3>

        <button type="button" class="join-btn filter-open-btn" onclick="openFilterPopup()">
            Filteri
        </button>

        <div id="filterPopup" class="filter-popup">
            <div class="filter-popup-content">
                <div class="filter-popup-header">
                    <h4>Filteri</h4>
                    <button type="button" class="filter-close-btn" onclick="closeFilterPopup()">×</button>
                </div>
                <div class="filter-box">
                    <select id="filterCafe" class="filter-input">
                        <option value="">Svi kafići</option>
                        <option th:each="event : ${events}"
                                th:value="${event.kafic.id}"
                                th:text="${event.kafic.name}">
                        </option>
                    </select>
                    <select id="filterLevel" class="filter-input">
                        <option value="">Sve razine</option>
                        <option value="1">Početnička</option>
                        <option value="2">Ležerna</option>
                        <option value="3">Kompetitivna</option>
                    </select>
                    <select id="filterGame" class="filter-input">
                        <option value="">Sve igre</option>
                        <option value="Alias">Alias</option>
                        <option value="Briškule">Briškule</option>
                        <option value="Catan">Catan</option>
                        <option value="Exploding Kittens">Exploding Kittens</option>
                        <option value="Monopoly">Monopoly</option>
                        <option value="Poker">Poker</option>
                        <option value="Risk">Risk</option>
                        <option value="Scrabble">Scrabble</option>
                        <option value="Uno">Uno</option>
                        <option value="Vukodlak">Vukodlak</option>
                        <option value="Šah">Šah</option>
                    </select>
                    <input type="date" id="filterDate" class="filter-input">
                    <button type="button" class="join-btn" onclick="filterEvents(); closeFilterPopup();">Primijeni filtere</button>
                    <button type="button" class="join-btn" onclick="clearFilters(); closeFilterPopup();">Očisti filtere</button>
                </div>
            </div>
        </div>

        <p th:if="${param.error != null and param.error[0] == 'full'}" class="error-msg">
            Ovaj event je pun!
        </p>
        <p th:if="${param.error != null and param.error[0] == 'already_joined'}" class="error-msg">
            Već si se priključio ovom eventu!
        </p>

        <!-- EVENT KARTICE -->
        <div class="event-card"
             th:each="event : ${events}"
             th:attr="data-cafe-id=${event.kafic.id},
                      data-level=${event.level},
                      data-date=${#temporals.format(event.datumVrijeme, 'yyyy-MM-dd')},
                      data-game=${event.nazivIgre}">

            <div class="event-info">
                <span class="event-cafe" th:text="${event.kafic.name}"></span>
                <span class="event-game" th:text="${event.nazivIgre}"></span>
                <span class="event-level"
                      th:text="'Razina: ' + (${event.level} == '1' ? 'Početnička' :
                               (${event.level} == '2' ? 'Ležerna' : 'Kompetitivna'))">
                </span>
                <span class="event-time"
                      th:text="${#temporals.format(event.datumVrijeme, 'dd.MM.yyyy HH:mm')}"></span>
                <span class="event-spots"
                      th:text="${currentPlayers[event.id]} + ' / ' + ${event.maxPlayers} + ' igrača'"></span>

                <!-- LISTA PRIJAVLJENIH IGRAČA -->
                <span class="event-players-list">
                    <th:block th:each="participant, iter : ${eventParticipants[event.id]}">
                    <a th:href="@{'/profile/' + ${participant}}"
                    class="participant-link"
                    th:text="${participant}"></a><th:block th:if="${!iter.last}">, </th:block>
                    </th:block>
                </span>
            </div>

            <!-- Nije ulogiran -->
            <a th:if="${!loggedIn}" th:href="@{/login}" class="join-btn">Prijavi se</a>

            <!-- Organizator: može obrisati event -->
            <form th:if="${loggedIn and isOrganizer[event.id]}"
                  th:action="@{/delete-event}" method="post"
                  onsubmit="return confirm('Sigurno želiš obrisati ovaj event?');">
                <input type="hidden" name="eventId" th:value="${event.id}">
                <button class="join-btn delete-btn" type="submit">Obriši event</button>
            </form>

            <!-- Pun (nije organizator, nije joinao) -->
            <button th:if="${loggedIn and !isOrganizer[event.id] and !userJoined[event.id] and isFull[event.id]}"
                    class="join-btn" disabled>Puno</button>

            <!-- Joinao, nije organizator — može odustati -->
            <form th:if="${loggedIn and !isOrganizer[event.id] and userJoined[event.id]}"
                  th:action="@{/leave}" method="post">
                <input type="hidden" name="eventId" th:value="${event.id}">
                <button class="join-btn leave-btn" type="submit">Odustani</button>
            </form>

            <!-- Može se pridružiti -->
            <form th:if="${loggedIn and !isOrganizer[event.id] and !userJoined[event.id] and !isFull[event.id]}"
                  th:action="@{/join}" method="post">
                <input type="hidden" name="eventId" th:value="${event.id}">
                <button class="join-btn" type="submit">Pridruži se</button>
            </form>
        </div>
    </aside>

    <!-- MAPA -->
    <div class="find-map">
        <iframe style="width: 100%; height: 100%; border: 0;" allowfullscreen allow="geolocation"
                src="//umap.openstreetmap.fr/hr/map/kafici-za-igranje-drustvenih-igara_1396725?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=false&searchControl=true&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=true&homeControl=false&fullscreenControl=true&locateControl=false&measureControl=false&printControl=false"></iframe>
    </div>

</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
