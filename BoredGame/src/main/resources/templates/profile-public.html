<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${username} + ' – profil'">Profil</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="logo">
                </div>

                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>

                <div class="nav-links">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>
            </div>

            <div class="flex-grow-1"></div>

            <div class="nav-right">
                <div th:if="${loggedIn}" class="logged-user-nav">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>

                    <a th:href="@{/profile}">
                        <button class="profile_btn" title="Moj profil">

                            <img th:if="${profilePicture != null}"
                                 th:src="@{'/profile-pictures/' + ${profilePicture}}"
                                 class="nav-profile-image"
                                 alt="Profil">

                            <i th:unless="${profilePicture != null}"
                               class="fa-solid fa-circle-user"></i>

                        </button>
                    </a>

                    <a th:href="@{/logout}">
                        <button class="login_btn">Log Out</button>
                    </a>
                </div>

                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}">
                        <button class="login_btn">Log In</button>
                    </a>
                </div>

                <a th:href="@{/aboutus}">
                    <button class="info_btn">
                        <i class="fa-regular fa-circle-question"></i>
                    </button>
                </a>
            </div>
        </div>
    </div>
</section>

<div class="profile-wrapper">
    <div class="profile-card">

        <div class="profile-avatar-section">
            <div class="profile-avatar-wrap" style="cursor: default;">
                <img th:if="${profilePicture != null}"
                     th:src="@{'/profile-pictures/' + ${profilePicture}}"
                     class="profile-avatar-img" alt="Slika profila">
                <div th:unless="${profilePicture != null}" class="profile-avatar-placeholder">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>

        <div class="profile-username-display" th:text="${username}"></div>

        <div th:if="${bio != null and !#strings.isEmpty(bio)}" class="profile-bio-readonly">
            <p th:text="${bio}"></p>
        </div>
        <div th:unless="${bio != null and !#strings.isEmpty(bio)}" class="profile-bio-empty">
            Ovaj korisnik još nije dodao opis.
        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
