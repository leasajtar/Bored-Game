<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Natjecanja i kvizovi</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="logo">
                </div>

                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>

                <div class="nav-links">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>
            </div>

            <div class="flex-grow-1"></div>

            <div class="nav-right">
                <div th:if="${loggedIn}" class="logged-user-nav">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>

                    <a th:href="@{/profile}">
                        <button class="profile_btn" title="Moj profil">

                            <img th:if="${profilePicture != null}"
                                 th:src="@{'/profile-pictures/' + ${profilePicture}}"
                                 class="nav-profile-image"
                                 alt="Profil">

                            <i th:unless="${profilePicture != null}"
                               class="fa-solid fa-circle-user"></i>

                        </button>
                    </a>

                    <a th:href="@{/logout}">
                        <button class="login_btn">Log Out</button>
                    </a>
                </div>

                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}">
                        <button class="login_btn">Log In</button>
                    </a>
                </div>

                <a th:href="@{/aboutus}">
                    <button class="info_btn">
                        <i class="fa-regular fa-circle-question"></i>
                    </button>
                </a>
            </div>
        </div>
    </div>
</section>
<main class="center-events-page">

    <h1 class="center-events-title">Natjecanja i kvizovi</h1>

    <section class="event-section">
        <h2>Natjecanja</h2>

        <p th:if="${param.error != null and param.error[0] == 'full'}" class="error-msg">
            Ovo natjecanje je puno!
        </p>

        <p th:if="${param.error != null and param.error[0] == 'already_joined'}" class="error-msg">
            Već si prijavljen na ovo natjecanje!
        </p>

        <div class="center-card-grid">
            <div class="big-event-card" th:each="competition : ${competitions}">
                <span class="event-tag">Natjecanje</span>

                <h3 th:text="${competition.gameType}"></h3>

                <p>
                    <strong>Kafić:</strong>
                    <span th:text="${competition.cafe.name}"></span>
                </p>

                <p>
                    <strong>Datum:</strong>
                    <span th:text="${#temporals.format(competition.date, 'dd.MM.yyyy')}"></span>
                </p>

                <p>
                    <strong>Vrijeme:</strong>
                    <span th:text="${#temporals.format(competition.time, 'HH:mm')}"></span>
                </p>

                <p>
                    <strong>Ulaznica:</strong>
                    <span th:text="${competition.entryFee + ' €'}"></span>
                </p>

                <p>
                    <strong>Prijavljeni:</strong>
                    <span th:text="${currentPlayers[competition.id]} + ' / ' + ${competition.maxPlayers}"></span>
                </p>

                <a th:if="${!loggedIn}" th:href="@{/login}" class="join-btn">
                    Prijavi se
                </a>

                <button th:if="${loggedIn and !userJoined[competition.id] and isFull[competition.id]}"
                        class="join-btn"
                        disabled>
                    Puno
                </button>

                <form th:if="${loggedIn and userJoined[competition.id]}"
                      th:action="@{/leaveCompetition}"
                      method="post">
                    <input type="hidden" name="competitionId" th:value="${competition.id}">
                    <button class="join-btn leave-btn" type="submit">
                        Odustani
                    </button>
                </form>

                <form th:if="${loggedIn and !userJoined[competition.id] and !isFull[competition.id]}"
                      th:action="@{/joinCompetition}"
                      method="post">
                    <input type="hidden" name="competitionId" th:value="${competition.id}">
                    <button class="join-btn" type="submit">
                        Prijavi se
                    </button>
                </form>
            </div>
        </div>
    </section>

    <section class="event-section">
        <h2>Kvizovi</h2>

        <div class="center-card-grid">
            <div class="big-event-card quiz-card" th:each="quiz : ${quizzes}">
                <span class="event-tag">Kviz</span>

                <h3 th:text="${quiz.description}">Večer kviza općeg znanja</h3>

                <p>
                    <strong>Kafić:</strong>
                    <span th:text="${quiz.cafe.name}">Ime kafića</span>
                </p>

                <p>
                    <strong>Datum:</strong>
                    <span th:text="${#temporals.format(quiz.date, 'dd.MM.yyyy')}">16.06.2026</span>
                </p>

                <p>
                    <strong>Vrijeme:</strong>
                    <span th:text="${#temporals.format(quiz.time, 'HH:mm')}">20:00</span>
                </p>

                <p>
                    <strong>Ulaznica:</strong>
                    <span th:text="${quiz.entryFee + ' €'}">3 €</span>
                </p>
            </div>
        </div>
    </section>

</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
