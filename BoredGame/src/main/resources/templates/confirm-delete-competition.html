<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Potvrda brisanja</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-wrapper">

<section class="admin_make">

    <h2>Potvrda brisanja natjecanja</h2>

    <p>
        Stvarno želite obrisati natjecanje:
    </p>

    <h3 th:text="${competition.gameType}"></h3>

    <p>
        Datum:
        <span th:text="${competition.date}"></span>
    </p>

    <form th:action="@{/admin/obrisi/natjecanje/{id}(id=${competition.id})}"
          method="post">

        <button class="join-btn leave-btn" type="submit">
            Trajno obriši
        </button>

    </form>

    <br>

    <a th:href="@{/admin/obrisi}">
        <button class="join-btn">
            Odustani
        </button>
    </a>

</section>
</div>


</body>
</html>
