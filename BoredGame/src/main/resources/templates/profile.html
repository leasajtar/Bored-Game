<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Moj profil</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="bored game logo" height="50">
                </div>
                <div class="nav-links">
                    <a th:href="@{/find}"><button class="left_btns">Pronađi</button></a>
                    <a th:href="@{/organiziranje}"><button class="left_btns">Organiziraj</button></a>
                </div>
                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}"><button class="left_btns">Pronađi</button></a>
                    <a th:href="@{/organiziranje}"><button class="left_btns">Organiziraj</button></a>
                </div>
            </div>

            <div class="flex-grow-1"></div>

            <div class="nav-right">
                <div th:if="${loggedIn}">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>
                    <a th:href="@{/profile}"><button class="profile_btn active-page" title="Moj profil"><i class="fa-solid fa-circle-user"></i></button></a>
                    <a th:href="@{/logout}"><button class="login_btn">Log Out</button></a>
                </div>
                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}"><button class="login_btn">Log In</button></a>
                </div>
                <a th:href="@{/aboutus}">
                    <button class="info_btn"><i class="fa-regular fa-circle-question"></i></button>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- PROFILE CONTENT -->
<div class="profile-wrapper">
    <div class="profile-card">

        <!-- Avatar sekcija -->
        <div class="profile-avatar-section">
            <div class="profile-avatar-wrap" onclick="document.getElementById('avatarInput').click()" title="Promijeni sliku profila">
                <img th:if="${profilePicture != null}"
                     th:src="@{'/profile-pictures/' + ${profilePicture}}"
                     class="profile-avatar-img" alt="Slika profila">
                <div th:unless="${profilePicture != null}" class="profile-avatar-placeholder">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="profile-avatar-overlay">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>
            <p class="profile-avatar-hint">Klikni za promjenu slike</p>
        </div>

        <!-- Username (samo prikaz, ne mijenja se) -->
        <div class="profile-username-display">
            <span th:text="${username}"></span>
        </div>

        <!-- Poruka o uspjehu/grešci -->
        <div th:if="${param.success}" class="profile-alert profile-alert-success">
            <i class="fa-solid fa-circle-check"></i> Profil uspješno ažuriran!
        </div>
        <div th:if="${param.error}" class="profile-alert profile-alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> Greška pri ažuriranju profila.
        </div>

        <!-- Form za upload slike (skriveni) -->
        <form id="avatarForm" th:action="@{/profile/upload-picture}" method="post" enctype="multipart/form-data" style="display:none;">
            <input type="file" id="avatarInput" name="profilePicture" accept="image/jpeg,image/png,image/webp"
                   onchange="document.getElementById('avatarForm').submit()">
        </form>

        <!-- Form za opis -->
        <form th:action="@{/profile/update}" method="post" class="profile-bio-form">
            <div class="profile-field">
                <label class="profile-label">O meni</label>
                <textarea
                        name="bio"
                        class="profile-bio-input"
                        placeholder="Napiši nešto o sebi — omiljene igre, razina iskustva, dostupnost..."
                        maxlength="300"
                        th:text="${bio}"
                ></textarea>
                <span class="profile-bio-count"><span id="bioCount">0</span> / 300</span>
            </div>
            <button type="submit" class="profile-save-btn">
                <i class="fa-solid fa-floppy-disk"></i> Spremi promjene
            </button>
        </form>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    // Brojač znakova za bio
    const bioTextarea = document.querySelector('.profile-bio-input');
    const bioCount = document.getElementById('bioCount');
    if (bioTextarea && bioCount) {
        bioCount.textContent = bioTextarea.value.length;
        bioTextarea.addEventListener('input', () => {
            bioCount.textContent = bioTextarea.value.length;
        });
    }
</script>
</body>
</html>
