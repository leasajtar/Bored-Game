<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://kit.fontawesome.com/34542901a1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<!-- HEADER -->
<section class="nav-bar">
    <div class="container-fluid">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/images/bored-game-text.png}" alt="logo">
                </div>

                <button class="hamburger-btn" onclick="toggleMenu()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="nav-menu" id="navMenu">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>

                <div class="nav-links">
                    <a th:href="@{/find}">
                        <button class="left_btns">Pronađi</button>
                    </a>
                    <a th:href="@{/organiziranje}">
                        <button class="left_btns">Organiziraj</button>
                    </a>
                    <a th:href="@{/events}">
                        <button class="left_btns">Natjecanja i kvizovi</button>
                    </a>
                </div>
            </div>

            <div class="flex-grow-1"></div>

            <div class="nav-right">
                <div th:if="${loggedIn}" class="logged-user-nav">
                    <span class="nav-username" th:text="'Hej, ' + ${username}"></span>

                    <a th:href="@{/profile}">
                        <button class="profile_btn" title="Moj profil">

                            <img th:if="${profilePicture != null}"
                                 th:src="@{'/profile-pictures/' + ${profilePicture}}"
                                 class="nav-profile-image"
                                 alt="Profil">

                            <i th:unless="${profilePicture != null}"
                               class="fa-solid fa-circle-user"></i>

                        </button>
                    </a>

                    <a th:href="@{/logout}">
                        <button class="login_btn">Log Out</button>
                    </a>
                </div>

                <div th:unless="${loggedIn}">
                    <a th:href="@{/login}">
                        <button class="login_btn">Log In</button>
                    </a>
                </div>

                <a th:href="@{/aboutus}">
                    <button class="info_btn">
                        <i class="fa-regular fa-circle-question"></i>
                    </button>
                </a>
            </div>
        </div>
    </div>
</section>

<section class="login">
    <h2>Log In:</h2>

    <p th:if="${param.error}" style="color: red;">Krivo korisničko ime ili lozinka.</p>

    <div class="login_form">
        <form action="/login" method="post">
            <input name="username" placeholder="Korisničko ime" required><br>
            <input name="password" placeholder="Lozinka" type="password" required><br>
            <button class="login_submit_btn" type="submit">Prijavi se</button>
        </form>
    </div>

    <p style="margin-top: 12px;">Nemaš račun? <a th:href="@{/register}">Registriraj se!</a></p>
    <p style="margin-top: 8px;">
        Administrator? <a th:href="@{/admin/login}">Admin prijava</a>
    </p>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
